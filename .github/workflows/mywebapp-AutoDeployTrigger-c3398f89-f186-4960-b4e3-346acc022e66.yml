name: Trigger auto deployment for mywebapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/mywebapp-AutoDeployTrigger-c3398f89-f186-4960-b4e3-346acc022e66.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MYWEBAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MYWEBAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MYWEBAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.MYWEBAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MYWEBAPP_REGISTRY_PASSWORD }}
          containerAppName: mywebapp
          resourceGroup: RG-ContainerApps
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


